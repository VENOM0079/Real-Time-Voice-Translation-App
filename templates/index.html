<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Voice Translation</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Animate.css for entrance animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .recording-indicator { 
            display: none; 
            color: red; 
            animation: blink 1.5s infinite; 
            font-weight: bold;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        #transcriptionFeed {
            max-height: 60vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .feed-entry {
            margin-bottom: 10px;
        }
        .time-badge {
            font-size: 0.8em;
            color: #6c757d;
        }
        .spinner-container {
            display: none;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row mb-4">
        <div class="col-md-8 mx-auto text-center">
            <h1 class="display-4 text-primary">Voice Translator <i class="fa fa-language"></i></h1>
            <p class="lead">Process RTSP stream audio and see the English translation in real-time.</p>
            <hr>
            
            <div class="controls bg-white p-4 shadow-sm rounded">
                <button id="startBtn" class="btn btn-success btn-lg mx-2">
                    <i class="fa fa-play"></i> Start RTSP Stream
                </button>
                <button id="stopBtn" class="btn btn-danger btn-lg mx-2" disabled>
                    <i class="fa fa-stop"></i> Stop RTSP Stream
                </button>
                <button id="exportBtn" class="btn btn-outline-info btn-lg mx-2">
                    <i class="fa fa-download"></i> Export Log
                </button>
                <div class="mt-3 recording-indicator" id="recordingIndicator">
                    <i class="fa fa-circle text-danger"></i> Processing RTSP stream...
                </div>
            </div>
            
            <div id="statusMessage" class="mt-3 text-muted"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Translation Feed</h5>
                </div>
                <div class="card-body bg-light" id="transcriptionFeed">
                    <div class="text-center text-muted" id="placeholder">
                        Start the RTSP stream to see translations here.
                    </div>
                </div>
                <div class="card-footer bg-white border-0 spinner-container" id="spinnerContainer">
                    <div class="spinner-border text-primary" role="status">
                        <span class="sr-only">Processing...</span>
                    </div>
                    <span class="ml-2">Whisper processing audio...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<!-- Application Logic -->
<script src="/static/js/recorder.js"></script>

</body>
</html>
